name: Build APK Directly to Repo

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'LiteVolume.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Locate Project & Build APK
        run: |
          if [ -f "LiteVolume-Android-Project.zip" ]; then
            unzip -o LiteVolume-Android-Project.zip
          fi
          if [ -f "LiteVolume/settings.gradle.kts" ]; then
            cd LiteVolume
            gradle assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../LiteVolume.apk
          elif [ -f "settings.gradle.kts" ]; then
            gradle assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ./LiteVolume.apk
          else
            echo "Project files not found!"
            exit 1
          fi

      - name: Save LiteVolume.apk to Repo Main Page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LiteVolume.apk
          git commit -m "Auto-built installable LiteVolume.apk" || true
          git push

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LiteVolume-APK
          path: LiteVolume.apk
